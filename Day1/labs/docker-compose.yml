# Advanced Data Engineering - week-long lab stack
# Day 1 uses: postgres, pg_replica, minio, trino, neo4j, marimo (PySpark runs local[*] in marimo)
# Later days uncomment: kafka, schema-registry, flink, airflow
name: adetc

# Shared Airflow settings. Airflow keeps its metadata in the same Postgres the labs
# use, in its own `airflow` database, and runs LocalExecutor - one machine, real
# parallelism, no Celery or Redis to operate (deck slide 3).
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://de:de@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  # Every learner is an admin and there is no login screen. The course runs no
  # credentials anywhere, and a generated password in a container file is friction
  # with no teaching value.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
  AIRFLOW__API__EXPOSE_CONFIG: "true"
  # Lab 3.1 re-runs single intervals repeatedly; a short parse interval keeps the UI
  # honest when learners edit the DAG mid-lab.
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "15"
  # Defines the Airflow Connection `rides_pg` without anyone having to click through
  # the UI. AIRFLOW_CONN_<ID> is the documented env-var form of a connection.
  AIRFLOW_CONN_RIDES_PG: postgresql://de:de@postgres:5432/rides
  # Airflow 3 tasks call back to the API server over HTTP instead of touching the
  # metadata DB directly. The default is http://localhost:8080/execution/, which is
  # wrong the moment the scheduler and the API server are different containers -
  # every task then dies with "httpx.ConnectError: Connection refused" while the
  # DAG itself parses perfectly.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  # The scheduler signs a JWT that the API server has to verify. Each container
  # generates its own secret unless told otherwise, so without a SHARED value every
  # task fails with "ServerResponseError: Invalid auth token" - after the DAG has
  # parsed, been scheduled and been queued, which makes it look like a DAG bug.
  # A fixed literal is fine here: nothing in this course is exposed off the laptop.
  AIRFLOW__API_AUTH__JWT_SECRET: adetc-day3-lab-secret
  AIRFLOW__CORE__FERNET_KEY: dGhpc19pc19hX2R1bW15X2Zlcm5ldF9rZXlfMzJieXRlcw=
  PGPASSWORD: de

# Shared definition for the two Flink TaskManagers (see flink-taskmanager-1/-2).
x-flink-taskmanager: &flink-tm
  build: ./flink
  command: taskmanager
  depends_on:
    flink-jobmanager:
      condition: service_healthy
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 2
      taskmanager.memory.process.size: 1400m
  volumes:
    - ./work:/work
    - ../../Day2/labs/work:/work/day2
    - ./data:/data
  # A TaskManager exposes no REST endpoint, so readiness is taken from its own log:
  # the line it writes once it has registered with the JobManager and its slots are
  # actually offered. Checking the JobManager instead would report the cluster's
  # health, not this container's, and would pass even with this TaskManager dead.
  healthcheck:
    test: ["CMD-SHELL", "grep -q 'Successful registration at resource manager' /opt/flink/log/*taskexecutor*.log || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 15
    start_period: 25s

services:
  postgres:
    image: imresamu/postgis:18-3.6
    # wal_level=logical, not replica: Day 3's Debezium connector decodes the WAL
    # logically and refuses to start otherwise. logical is a superset of replica, so
    # lab 1.1's physical streaming replication is unaffected.
    command: >
      postgres -c wal_level=logical -c max_wal_senders=8
               -c max_replication_slots=8 -c hot_standby=on
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de
      POSTGRES_DB: rides
    ports: ["5432:5432"]
    volumes:
      - ./seed:/docker-entrypoint-initdb.d
      - ./data:/data
      # Lab 2.5 runs a SQL file inside this container, the same way marimo and Flink
      # read /work. Without these the psql -f is a file-not-found.
      - ./work:/work
      # Day 2's lab files live in Day2/labs/work. Mounting them at /work/day2 keeps
      # every container's lab path a single /work tree, and makes them show up as a
      # day2/ folder in marimo's file browser. Docker creates the empty mountpoint
      # Day1/labs/work/day2/ on the host - it is gitignored.
      - ../../Day2/labs/work:/work/day2
      - ../../Day3/labs/work:/work/day3
      # PG18+ images REFUSE to start if anything exists at /var/lib/postgresql/data.
      # The mount goes one level up; the server then lives in $PGDATA,
      # /var/lib/postgresql/18/docker. See docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de -d rides"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Lab 1.1 only. Built from the primary with pg_basebackup on first start.
  pg_replica:
    image: imresamu/postgis:18-3.6
    profiles: ["replica"]
    user: postgres
    depends_on: [postgres]
    environment:
      PGPASSWORD: de
    ports: ["5433:5432"]
    volumes:
      - pgreplica:/var/lib/postgresql
    # -S replica1 adopts the physical slot created by seed/02_replication_slot.sql.
    # Without a slot the standby streams anyway, but pg_replication_slots stays
    # empty and lab 1.1 step 5 has no WAL retention to measure.
    # $$PGDATA (escaped so compose passes it through) is /var/lib/postgresql/18/docker
    # on PG18+. Hardcoding the old /var/lib/postgresql/data path here makes the
    # basebackup land somewhere postgres will not read.
    entrypoint: >
      bash -c "
      if [ ! -s \"$$PGDATA/PG_VERSION\" ]; then
        until pg_isready -h postgres -U de; do sleep 2; done;
        mkdir -p \"$$PGDATA\";
        rm -rf \"$$PGDATA\"/*;
        pg_basebackup -h postgres -U de -D \"$$PGDATA\" -Fp -Xs -R -P -S replica1;
        chmod 700 \"$$PGDATA\";
      fi;
      exec postgres"
    # start_period covers the first-run pg_basebackup, which copies the whole
    # primary before postgres is even launched. A standby answers pg_isready once
    # it accepts read-only connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de -d rides"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: creates the lake bucket the labs write to. MinIO starts with no
  # buckets, so without this every s3a write fails with
  #   NoSuchBucket: The specified bucket does not exist (404)
  # Reuses the minio image because it already ships mc - no extra pull.
  # Exits 0 once the bucket exists; `docker compose ps` showing it Exited is normal.
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set lake http://minio:9000 admin password &&
      mc mb --ignore-existing lake/rides-lake &&
      mc ls lake
      "
    restart: "no"

  trino:
    image: trinodb/trino:483
    depends_on: [minio]
    ports: ["8080:8080"]
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      # Mounted at /data/trino, NOT /opt/metastore. Trino runs as uid 1000, and
      # Docker creates a missing mount point root-owned - the file metastore then
      # cannot write .<schema>.trinoSchema and every CREATE SCHEMA fails with
      #   Could not read database schema from file:///opt/metastore/...
      # /data/trino already exists in the image owned by trino:trino, so an empty
      # named volume mounted there inherits that ownership. The catalog dir is the
      # `metastore` subdirectory (see trino/catalog/hive.properties).
      - trinometastore:/data/trino
      # Labs 3.3 and 3.4 run SQL files from here with `trino -f`.
      - ../../Day3/labs/work:/work/day3
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  neo4j:
    image: neo4j:2026.07.1
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_apoc_import_file_enabled: "true"
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - ./import:/var/lib/neo4j/import
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  # Notebook surface for the whole week. marimo, run under uv.
  marimo:
    build: ./marimo
    # 4040 is the Spark driver UI. Labs 2.1 and 2.2 read the SQL tab and the stage
    # task-duration histogram from it, so it has to be reachable from the host; it
    # serves only while a SparkSession is alive in the notebook.
    ports: ["8888:8888", "4040:4040"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      NEO4J_URI: bolt://neo4j:7687
      PGHOST: postgres
    volumes:
      - ./work:/work
      # Day 2's lab files live in Day2/labs/work. Mounting them at /work/day2 keeps
      # every container's lab path a single /work tree, and makes them show up as a
      # day2/ folder in marimo's file browser. Docker creates the empty mountpoint
      # Day1/labs/work/day2/ on the host - it is gitignored.
      - ../../Day2/labs/work:/work/day2
      - ./data:/data
    working_dir: /work
    # --project /opt/app because ./work is mounted over /work (see marimo/Dockerfile).
    command: >
      uv run --project /opt/app --frozen --no-dev
        marimo edit --headless --host 0.0.0.0 --port 8888 --no-token
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Standalone Spark cluster for the later days. Behind the `spark` profile so
  # Day 1 stays lean: lab 2.2 runs PySpark local[*] inside marimo, no cluster.
  #   docker compose --profile spark up -d
  # Image is apache/spark (official). 4.1.3 is pinned to match pyspark==4.1.3 in
  # the marimo image - a driver/cluster version mismatch fails at handshake.
  spark-master:
    image: apache/spark:4.1.3
    profiles: ["spark"]
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        --host spark-master --port 7077 --webui-port 8080
    ports: ["7077:7077", "8090:8080"]
    volumes:
      - ./work:/work
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # A master alone executes nothing - the worker is what holds the cores.
  # Mounts match marimo's paths so driver and executors resolve /data identically.
  spark-worker:
    image: apache/spark:4.1.3
    profiles: ["spark"]
    depends_on:
      spark-master:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077 --webui-port 8081
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    ports: ["8091:8081"]
    volumes:
      - ./work:/work
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Runs once, then exits 0: creates the `airflow` database if it is missing and
  # applies the metadata schema. `Exited (0)` is its correct state.
  airflow-init:
    image: apache/airflow:3.3.1
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-env
    volumes:
      - ../../Day3/labs/work:/opt/airflow/day3
      - ../../Day3/labs/work/dags:/opt/airflow/dags
    entrypoint: ["bash", "/opt/airflow/day3/airflow_init.sh"]
    restart: "no"

  airflow-apiserver:
    image: apache/airflow:3.3.1
    command: api-server
    ports: ["8079:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ../../Day3/labs/work:/opt/airflow/day3
      - ../../Day3/labs/work/dags:/opt/airflow/dags
      - airflowlogs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/version >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Airflow 3 runs the DAG processor out of process, so it is its own service rather
  # than a thread inside the scheduler as it was on 2.x.
  airflow-scheduler:
    image: apache/airflow:3.3.1
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ../../Day3/labs/work:/opt/airflow/day3
      - ../../Day3/labs/work/dags:/opt/airflow/dags
      - airflowlogs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  airflow-dag-processor:
    image: apache/airflow:3.3.1
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ../../Day3/labs/work:/opt/airflow/day3
      - ../../Day3/labs/work/dags:/opt/airflow/dags
      - airflowlogs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$$(hostname)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # --- Day 3: pipelines and the lakehouse ------------------------------------
  # Also started by a plain `docker compose up -d`. Day 3 does not use Flink or
  # Neo4j, and the Day 3 README tells the room to stop them to get the memory back.

  # Holds Iceberg table pointers; MinIO holds the data and metadata files. The
  # "fixture" image is the Iceberg project's own REST catalog, backed here by a
  # SQLite file on a named volume so table pointers survive a restart.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    ports: ["8181:8181"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://rides-lake/iceberg
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # /home/iceberg is the one directory the image's non-root user (uid 1000)
      # already owns, so a named volume mounted there inherits that ownership.
      # Pointing this at a fresh /catalog mount instead gives SQLITE_CANTOPEN.
      CATALOG_URI: jdbc:sqlite:file:/home/iceberg/catalog.db
      CATALOG_JDBC_SCHEMA__VERSION: V1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - icebergcatalog:/home/iceberg
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/v1/config?warehouse=s3://rides-lake/iceberg >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Debezium's Connect distribution: the Postgres connector is already on the
  # classpath, so lab 3.2 only has to POST a connector configuration.
  # Pulled from quay.io because Debezium's Docker Hub mirror stopped at 3.0.
  kafka-connect:
    image: quay.io/debezium/connect:3.6.2.Final
    ports: ["8083:8083"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-day3
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # Single broker, so Connect's own internal topics must ask for one replica.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --- Day 2: streaming -------------------------------------------------------
  # These start with a plain `docker compose up -d`, on purpose: Day 2 has no setup
  # lab, so the room must get a working stack from the one command they already know.
  # The cost is memory - see the RAM note in Day2/lab-instructions/README.md.

  # Single-node KRaft broker: no ZooKeeper to explain or babysit (deck slide 3).
  # Two listeners: PLAINTEXT for in-network clients (Flink, other containers) and
  # HOST for anything a learner runs from their own machine on localhost:29092.
  # Advertising only the internal name is the classic "works in exec, hangs from the
  # host" failure, which is why HOST is here even though every lab command uses exec.
  kafka:
    image: apache/kafka:4.3.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so every internal topic must ask for exactly one replica.
      # The defaults are 3 and the broker refuses to create __consumer_offsets.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Lab 2.3 adds and kills group members repeatedly. The 3 s default delay makes
      # every rebalance look like a hang.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - ./data:/data
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Built, not pulled: the SQL client needs the Kafka connector jar on the classpath.
  # See flink/Dockerfile for why the version pairing is not negotiable.
  flink-jobmanager:
    build: ./flink
    command: jobmanager
    ports: ["8081:8081"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.backend.type: hashmap
    volumes:
      - ./work:/work
      # Day 2's lab files live in Day2/labs/work. Mounting them at /work/day2 keeps
      # every container's lab path a single /work tree, and makes them show up as a
      # day2/ folder in marimo's file browser. Docker creates the empty mountpoint
      # Day1/labs/work/day2/ on the host - it is gitignored.
      - ../../Day2/labs/work:/work/day2
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Two TaskManagers, two slots each (deck slide 3), as separate named services
  # rather than `replicas: 2`, so lab 2.4 can say `docker compose kill
  # flink-taskmanager-1` verbatim and have it mean one specific container.
  flink-taskmanager-1:
    <<: *flink-tm
  flink-taskmanager-2:
    <<: *flink-tm

volumes:
  pgdata:
  pgreplica:
  miniodata:
  neo4jdata:
  trinometastore:
  kafkadata:
  icebergcatalog:
  airflowlogs:
