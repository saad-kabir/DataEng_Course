# Day 3. Iceberg tables via the REST catalog; data and metadata live in MinIO.
# Separate from the `hive` catalog: same object store, different table format, and
# the point of Day 3 chapter 2 is what the metadata layer adds on top of Parquet.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://rides-lake/iceberg
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password
