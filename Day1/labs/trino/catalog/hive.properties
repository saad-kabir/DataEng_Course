connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=file:///data/trino/metastore
# Trino 483 renamed fs.native-s3.enabled -> fs.s3.enabled (the old name still
# loads but logs a deprecation warning at startup).
fs.s3.enabled=true
# The file metastore stores .<schema>.trinoSchema on the LOCAL filesystem, so
# the local file system support has to be switched on explicitly. Without it
# every CREATE SCHEMA fails with
#   Could not read database schema from file:///.../.<schema>.trinoSchema
fs.local.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password
hive.non-managed-table-writes-enabled=true
# The TLC Parquet stores pickup/dropoff timestamps at microsecond precision and
# labs 2.1/2.2 declare them timestamp(6). The connector defaults to MILLISECONDS,
# which rejects that DDL with
#   Incorrect timestamp precision for timestamp(6); the configured precision is MILLISECONDS
hive.timestamp-precision=MICROSECONDS
